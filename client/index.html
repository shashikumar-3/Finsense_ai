<!doctype html>
<html lang="en" style="background-color: #07110d; color: #e5eefb;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>FinSense AI</title>

    <meta
      name="description"
      content="FinSense AI combines live market data, news sentiment, and local RAG-style stock intelligence for better investing decisions."
    />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      html, body {
        background-color: #07110d;
        color: #e5eefb;
        margin: 0;
        min-height: 100vh;
      }
      #initial-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #07110d;
        color: #e5eefb;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        z-index: 9999;
      }
      .initial-spinner {
        width: 42px;
        height: 42px;
        border: 3px solid rgba(29, 223, 143, 0.15);
        border-top-color: #1ddf8f;
        border-radius: 50%;
        animation: initial-spin 0.8s linear infinite;
      }
      @keyframes initial-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>

  <body style="background-color: #07110d; color: #e5eefb; margin: 0; min-height: 100vh;">
    <div id="root">
      <div id="initial-splash">
        <div class="initial-spinner"></div>
        <p style="margin-top: 18px; font-size: 13px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: #94a3b8;">
          Loading FinSense AI...
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
